<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#e9eff8" />
  <title>小倉家 資産管理 v5</title>
  <style>
    :root{
      --bg:#edf3fb;
      --panel:#ffffff;
      --text:#111827;
      --muted:#6b7280;
      --line:#d9e4f2;
      --primary:#2f63d4;
      --primary-dark:#214fb6;
      --teal:#67cfa8;
      --teal2:#59c5c4;
      --shadow:0 10px 30px rgba(34,65,122,.10);
      --radius:24px;
      --safe-bottom:max(14px, env(safe-area-inset-bottom));
      --safe-top:max(8px, env(safe-area-inset-top));
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:linear-gradient(180deg,#edf3fb 0%, #eef4fb 100%);
      color:var(--text);
      padding-bottom:110px;
      -webkit-tap-highlight-color:transparent;
    }
    .app{
      max-width:520px;
      margin:0 auto;
      min-height:100vh;
    }
    header{
      padding:calc(12px + var(--safe-top)) 16px 8px;
    }
    .head-row{
      display:flex; align-items:center; justify-content:space-between; gap:12px;
    }
    .title{
      font-size:18px; font-weight:800; letter-spacing:-.02em;
      flex:1; text-align:center;
    }
    .head-side{
      width:44px; height:44px; border-radius:999px; display:flex; align-items:center; justify-content:center;
      color:var(--primary); background:rgba(255,255,255,.65); border:1px solid var(--line); font-size:20px;
      box-shadow:var(--shadow);
    }

    .screen{display:none}
    .screen.active{display:block}

    .filters{
      margin:8px 16px 0;
      display:grid; grid-template-columns:1fr 1fr; gap:10px;
    }
    .filters.single-button{
      grid-template-columns:1fr auto;
    }
    .filters .quick{
      display:flex; align-items:end;
    }
    label{
      font-size:12px; font-weight:800; color:#5b6472;
      display:block;
    }
    select, input, textarea{
      width:100%;
      margin-top:6px;
      border:1px solid var(--line);
      border-radius:16px;
      background:#fff;
      font-size:16px;
      padding:13px 12px;
      color:var(--text);
      font-family:inherit;
    }
    textarea{min-height:76px; resize:vertical}
    button{
      border:none;
      border-radius:16px;
      padding:12px 14px;
      background:var(--primary);
      color:#fff;
      font-weight:800;
      font-size:15px;
      font-family:inherit;
      cursor:pointer;
    }
    .ghost{
      background:#fff;
      color:var(--primary);
      border:1px solid #b9cdf4;
    }
    .soft{
      background:#f3f7ff;
      color:var(--primary);
      border:1px solid #dbe7fb;
    }
    .danger{
      background:#fff1f3;
      color:#db3d5e;
      border:1px solid #ffd1db;
    }
    section{margin:16px}
    .card{
      background:var(--panel);
      border-radius:28px;
      box-shadow:var(--shadow);
      border:1px solid rgba(211,223,242,.9);
      padding:18px;
      position:relative;
    }
    .summary-card{
      padding:18px 18px 20px;
    }
    .card-head{
      display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:8px;
    }
    .card-title{
      font-size:16px; font-weight:900; letter-spacing:-.03em;
    }
    .card-sub{
      font-size:12px; color:var(--muted); font-weight:700;
    }
    .eye{
      color:var(--primary); font-size:20px; line-height:1;
    }
    .big-num{
      font-size:46px; line-height:1.02; font-weight:900; letter-spacing:-.05em;
      margin:6px 0;
    }
    .yen{font-size:.72em}
    .delta{
      font-size:18px; font-weight:900; color:#2f8f89; letter-spacing:-.02em;
      display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    }
    .summary-meta{
      margin-top:12px; display:grid; grid-template-columns:1fr 1fr; gap:12px;
    }
    .meta-box{
      padding:12px 14px; border-radius:18px; background:#f7faff; border:1px solid #e2ebf8;
    }
    .meta-box span{
      display:block; font-size:12px; color:var(--muted); font-weight:800; margin-bottom:4px;
    }
    .meta-box strong{font-size:17px}

    .chart-box{
      margin-top:18px;
      border-top:1px solid #edf2fa;
      padding-top:14px;
    }
    .range-tabs{
      display:flex; gap:10px; margin-top:14px; flex-wrap:wrap;
    }
    .range-tab{
      min-width:84px; text-align:center; padding:12px 14px; border-radius:18px;
      background:#fff; color:#6b7280; border:1px solid #dbe6f6; font-weight:900;
    }
    .range-tab.active{
      background:var(--primary); color:#fff; border-color:var(--primary);
      box-shadow:0 8px 20px rgba(47,99,212,.24);
    }

    .area-wrap{
      margin-top:4px;
      background:linear-gradient(180deg,#ffffff 0%, #f8fbff 100%);
      border-radius:24px;
      position:relative;
      overflow:hidden;
      min-height:280px;
    }
    .area-wrap.small{min-height:250px}
    .axis-label{
      font-size:11px; fill:#7d8796; font-weight:700;
    }
    .axis-line{stroke:#d8e4f4; stroke-width:1; stroke-dasharray:3 4}
    .axis-bottom{stroke:#c7d6eb; stroke-width:1.4}
    .line-main{stroke:var(--primary); stroke-width:4; fill:none; stroke-linecap:round; stroke-linejoin:round}
    .area-main{fill:url(#gradArea)}
    .area-dot{fill:var(--primary)}

    .mini-grid{
      display:grid; grid-template-columns:1fr 1fr; gap:16px;
    }

    .tap-card{cursor:pointer}
    .tap-badge{
      position:absolute; right:16px; top:16px;
      background:#f2f7ff; color:var(--primary); border:1px solid #d5e3fb;
      padding:6px 10px; border-radius:999px; font-size:11px; font-weight:900;
    }

    .donut-layout{
      display:grid; grid-template-columns:1fr; gap:12px; align-items:center;
    }
    .donut-row-meta{
      display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:2px;
    }
    .donut-meta{
      font-size:12px; font-weight:900; color:#657082;
    }
    .donut-meta strong{
      display:block; margin-top:3px; font-size:16px; color:#2f8f89;
    }
    .donut-wrap{
      display:flex; justify-content:center; align-items:center; padding:8px 0 0;
    }
    .donut{
      width:min(76vw, 360px);
      height:min(76vw, 360px);
      border-radius:50%;
      position:relative;
      box-shadow:0 10px 26px rgba(33,79,182,.10);
      background:conic-gradient(var(--primary) 0 55%, var(--teal) 55% 95%, var(--teal2) 95% 100%);
    }
    .donut:after{
      content:"";
      position:absolute; inset:18%;
      background:#fff;
      border-radius:50%;
      box-shadow:inset 0 0 0 1px #edf2fa;
    }
    .donut-center{
      position:absolute; inset:0;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      z-index:1; text-align:center;
      padding:0 20%;
    }
    .donut-center .label{
      font-size:14px; font-weight:900; color:#374151;
    }
    .donut-center .value{
      margin-top:4px;
      font-size:27px; line-height:1.15; font-weight:900; letter-spacing:-.04em;
    }

    .legend{
      display:flex; flex-wrap:wrap; gap:12px 18px; justify-content:flex-start;
      margin-top:8px;
    }
    .legend-item{
      display:flex; align-items:center; gap:8px; font-weight:800; font-size:13px;
    }
    .swatch{
      width:16px; height:16px; border-radius:4px;
    }

    .owner-grid{
      display:grid; grid-template-columns:1fr 1fr; gap:12px;
    }
    .owner-card{
      background:#f7faff; border:1px solid #e1ebfa;
      border-radius:20px; padding:14px 16px;
    }
    .owner-card span{
      display:block; font-size:12px; color:var(--muted); font-weight:800;
    }
    .owner-card strong{
      display:block; margin-top:6px; font-size:22px; font-weight:900; letter-spacing:-.04em;
    }

    .section-title{
      margin-bottom:10px;
      font-size:16px; font-weight:900; letter-spacing:-.02em;
    }

    .list-summary{
      display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:12px;
    }
    .list-summary .owner-card{
      padding:12px;
    }
    .list-summary .owner-card strong{
      font-size:16px;
    }

    .group-title{
      font-size:15px; font-weight:900; margin:4px 0 4px;
      color:#1f2937;
    }
    .row{
      display:flex; justify-content:space-between; gap:12px;
      padding:13px 0; border-bottom:1px solid #edf2fa;
    }
    .row:last-child{border-bottom:none}
    .row-title{
      font-size:15px; font-weight:900; margin-bottom:4px;
    }
    .row-meta{
      color:var(--muted); font-size:12px; line-height:1.45; font-weight:700;
    }
    .row-amt{
      text-align:right; font-size:15px; font-weight:900; white-space:nowrap;
    }
    .row-amt small{
      display:block; margin-top:4px; font-size:11px; color:var(--muted); font-weight:800;
    }

    .stack{display:grid; gap:12px}
    .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px}

    .tabs{
      position:fixed; left:50%; transform:translateX(-50%);
      bottom:0; width:100%; max-width:520px;
      padding:10px 10px calc(var(--safe-bottom) + 2px);
      background:rgba(255,255,255,.78);
      backdrop-filter:blur(18px);
      border-top:1px solid rgba(215,227,245,.95);
      z-index:40;
    }
    .tabs-inner{
      background:#fff;
      border:1px solid #e1eaf7;
      border-radius:30px;
      box-shadow:0 16px 40px rgba(35,64,120,.12);
      display:grid;
      grid-template-columns:repeat(5,1fr);
      padding:10px 8px 8px;
    }
    .tab{
      background:transparent; color:#8891a1; border:none;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:6px; padding:10px 4px;
      border-radius:18px;
      min-height:84px;
    }
    .tab .icon{
      font-size:28px; line-height:1;
    }
    .tab .txt{
      font-size:12px; font-weight:900;
    }
    .tab.active{color:var(--primary)}
    .tab.active .icon{
      transform:translateY(-1px);
    }

    .modal{
      position:fixed; inset:0; display:none; align-items:stretch; justify-content:center;
      padding:var(--safe-top) 10px var(--safe-bottom);
      background:rgba(15,23,42,.54);
      z-index:90;
    }
    .modal.active{display:flex}
    .modal-panel{
      width:100%; max-width:560px; background:#fff; border-radius:28px;
      overflow:hidden; box-shadow:0 28px 70px rgba(0,0,0,.22);
      display:flex; flex-direction:column; max-height:100%;
    }
    .modal-head{
      padding:16px 16px 12px; display:flex; justify-content:space-between; gap:12px; align-items:flex-start;
      border-bottom:1px solid #edf2fa;
    }
    .modal-head strong{
      display:block; font-size:18px; font-weight:900;
    }
    .modal-head span{
      display:block; font-size:12px; color:var(--muted); font-weight:700; margin-top:4px;
    }
    .close{
      width:40px; height:40px; border-radius:999px; background:#f2f6fd; color:#355ec8; padding:0;
    }
    .modal-body{
      padding:16px; overflow:auto; -webkit-overflow-scrolling:touch;
    }

    .empty{
      text-align:center; color:var(--muted); font-weight:700; padding:30px 8px;
    }

    @media (max-width:390px){
      .big-num{font-size:39px}
      .filters,.form-grid,.owner-grid,.list-summary,.summary-meta,.mini-grid{grid-template-columns:1fr}
      .donut-center .value{font-size:24px}
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="head-row">
        <div class="head-side">⌂</div>
        <div class="title">小倉家 資産管理</div>
        <div class="head-side">◉</div>
      </div>
    </header>

    <main>
      <div id="dashboard" class="screen active">
        <div class="filters single-button">
          <label>
            表示月
            <select id="filterMonth" onchange="render()"></select>
          </label>
          <div class="quick">
            <button id="goCurrentBtn" class="ghost" style="display:none;" onclick="goCurrentMonth('filterMonth')">現在へ戻る</button>
          </div>
        </div>

        <div class="filters">
          <label>
            表示者
            <select id="filterOwner" onchange="render()">
              <option value="all">合計</option>
              <option value="晴太">晴太</option>
              <option value="香花">香花</option>
            </select>
          </label>
          <div></div>
        </div>

        <section>
          <div class="card summary-card tap-card" onclick="openChartModal('area')">
            <div class="card-head">
              <div>
                <div class="card-title">資産合計</div>
                <div id="summaryMonthText" class="card-sub">更新日時</div>
              </div>
              <div class="eye">◉</div>
            </div>

            <div id="netWorth" class="big-num">¥0<span class="yen">円</span></div>
            <div id="deltaText" class="delta">¥0</div>

            <div class="chart-box">
              <div id="areaChartCard" class="area-wrap small"></div>
              <div class="range-tabs">
                <button class="range-tab" onclick="setAreaRange('3m', event)">3ヶ月</button>
                <button class="range-tab" onclick="setAreaRange('6m', event)">6ヶ月</button>
                <button class="range-tab" onclick="setAreaRange('1y', event)">1年</button>
                <button class="range-tab active" onclick="setAreaRange('all', event)">全期間</button>
              </div>
            </div>
          </div>
        </section>

        <section>
          <div class="owner-grid">
            <div class="owner-card">
              <span>晴太 純資産</span>
              <strong id="harutaNet">¥0</strong>
            </div>
            <div class="owner-card">
              <span>香花 純資産</span>
              <strong id="kyokaNet">¥0</strong>
            </div>
          </div>
        </section>

        <section>
          <div class="mini-grid">
            <div id="pieCardWrap" class="card tap-card" onclick="openChartModal('pie')">
              <div class="tap-badge">拡大</div>
              <div class="section-title">資産割合</div>
              <div id="pieCard"></div>
            </div>

            <div class="card">
              <div class="section-title">内訳</div>
              <div class="summary-meta">
                <div class="meta-box">
                  <span>総資産</span>
                  <strong id="totalAssets">¥0</strong>
                </div>
                <div class="meta-box">
                  <span>総負債</span>
                  <strong id="totalLiabilities">¥0</strong>
                </div>
              </div>
              <div class="summary-meta" style="margin-top:10px;">
                <div class="meta-box">
                  <span>AEDレート</span>
                  <strong id="aedRateText">42</strong>
                </div>
                <div class="meta-box">
                  <span>USDレート</span>
                  <strong id="usdRateText">157</strong>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>

      <div id="list" class="screen">
        <div class="filters single-button">
          <label>
            一覧月
            <select id="listMonth" onchange="render()"></select>
          </label>
          <div class="quick">
            <button id="goCurrentBtnList" class="ghost" style="display:none;" onclick="goCurrentMonth('listMonth')">現在へ戻る</button>
          </div>
        </div>
        <div class="filters">
          <label>
            表示者
            <select id="listOwner" onchange="render()">
              <option value="all">合計</option>
              <option value="晴太">晴太</option>
              <option value="香花">香花</option>
            </select>
          </label>
          <div></div>
        </div>

        <section>
          <div class="list-summary">
            <div class="owner-card">
              <span>合計</span>
              <strong id="listTotalNet">¥0</strong>
            </div>
            <div class="owner-card">
              <span>晴太</span>
              <strong id="listHarutaNet">¥0</strong>
            </div>
            <div class="owner-card">
              <span>香花</span>
              <strong id="listKyokaNet">¥0</strong>
            </div>
          </div>

          <div id="entryList" class="card"></div>
        </section>
      </div>

      <div id="input" class="screen">
        <section>
          <div class="card">
            <div class="card-head" style="margin-bottom:12px;">
              <div>
                <div class="card-title">月次残高を入力</div>
                <div class="card-sub">最新月が初期表示。過去月も選択できます。</div>
              </div>
              <button class="soft" onclick="copyPreviousMonth()">前月コピー</button>
            </div>

            <form id="entryForm" class="stack">
              <div class="form-grid">
                <label>
                  月
                  <select id="entryMonth"></select>
                </label>
                <label>
                  所有者
                  <select id="entryOwner">
                    <option>晴太</option>
                    <option>香花</option>
                  </select>
                </label>
              </div>

              <label>
                大項目
                <select id="entryMainCategory"></select>
              </label>

              <label>
                小項目
                <select id="entryAccount"></select>
              </label>

              <div class="form-grid">
                <label>
                  資産種類
                  <select id="entryAssetClass">
                    <option>現金</option>
                    <option>株式（インデックス）</option>
                    <option>株式（個別）</option>
                    <option>外貨</option>
                    <option>クレジットカード</option>
                    <option>ローン</option>
                    <option>その他</option>
                  </select>
                </label>
                <label>
                  種別
                  <select id="entryType">
                    <option value="asset">資産</option>
                    <option value="liability">負債</option>
                  </select>
                </label>
              </div>

              <div class="form-grid">
                <label>
                  通貨
                  <select id="entryCurrency">
                    <option>JPY</option>
                    <option>AED</option>
                    <option>USD</option>
                  </select>
                </label>
                <label>
                  金額
                  <input id="entryAmount" type="number" inputmode="decimal" required />
                </label>
              </div>

              <label>
                メモ
                <textarea id="entryMemo" placeholder="例：月末残高 / カード請求予定"></textarea>
              </label>

              <button type="submit">保存する</button>
            </form>
          </div>
        </section>
      </div>

      <div id="masters" class="screen">
        <section>
          <div class="card stack">
            <div class="card-head" style="margin-bottom:6px;">
              <div>
                <div class="card-title">登録リスト</div>
                <div class="card-sub">大項目 → 小項目 を登録</div>
              </div>
              <button class="soft" onclick="loadPresetAccounts()">初期リスト</button>
            </div>

            <form id="accountForm" class="stack">
              <label>
                大項目
                <select id="accountMainCategory">
                  <option>銀行</option>
                  <option>証券口座</option>
                  <option>クレジットカード</option>
                  <option>現金</option>
                  <option>外貨口座</option>
                  <option>ローン</option>
                  <option>その他</option>
                </select>
              </label>

              <label>
                小項目名
                <input id="accountName" placeholder="例：SBI証券 インデックス" required />
              </label>

              <div class="form-grid">
                <label>
                  資産種類
                  <select id="accountAssetClass">
                    <option>現金</option>
                    <option>株式（インデックス）</option>
                    <option>株式（個別）</option>
                    <option>外貨</option>
                    <option>クレジットカード</option>
                    <option>ローン</option>
                    <option>その他</option>
                  </select>
                </label>
                <label>
                  標準通貨
                  <select id="accountCurrency">
                    <option>JPY</option>
                    <option>AED</option>
                    <option>USD</option>
                  </select>
                </label>
              </div>

              <button type="submit">登録する</button>
            </form>
          </div>
        </section>

        <section>
          <div id="accountList" class="card"></div>
        </section>
      </div>

      <div id="settings" class="screen">
        <section>
          <div class="card">
            <div class="card-head" style="margin-bottom:12px;">
              <div>
                <div class="card-title">設定</div>
                <div class="card-sub">為替レートとバックアップ</div>
              </div>
            </div>

            <form id="rateForm" class="stack">
              <div class="form-grid">
                <label>
                  1 AED = 円
                  <input id="rateAED" type="number" step="0.01" />
                </label>
                <label>
                  1 USD = 円
                  <input id="rateUSD" type="number" step="0.01" />
                </label>
              </div>
              <button type="submit">為替レートを保存</button>
            </form>

            <div class="stack" style="margin-top:14px;">
              <button class="soft" onclick="downloadBackup()">バックアップをダウンロード</button>
              <button class="danger" onclick="resetData()">データをリセット</button>
            </div>
          </div>
        </section>
      </div>
    </main>

    <div class="tabs">
      <div class="tabs-inner">
        <button class="tab active" data-tab="dashboard" onclick="showTab('dashboard')"><span class="icon">⌂</span><span class="txt">ホーム</span></button>
        <button class="tab" data-tab="list" onclick="showTab('list')"><span class="icon">▤</span><span class="txt">一覧</span></button>
        <button class="tab" data-tab="input" onclick="showTab('input')"><span class="icon">＋</span><span class="txt">入力</span></button>
        <button class="tab" data-tab="masters" onclick="showTab('masters')"><span class="icon">◎</span><span class="txt">登録</span></button>
        <button class="tab" data-tab="settings" onclick="showTab('settings')"><span class="icon">⚙</span><span class="txt">設定</span></button>
      </div>
    </div>
  </div>

  <div id="chartModal" class="modal" onclick="closeChartModal(event)">
    <div class="modal-panel" onclick="event.stopPropagation()">
      <div class="modal-head">
        <div>
          <strong id="modalTitle">グラフ</strong>
          <span id="modalSubtitle">詳細表示</span>
        </div>
        <button class="close" onclick="closeChartModal()">×</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "ogura-family-finance-v5";
    let areaRange = "all";

    const presetAccounts = [
      { id:"acc_smbc", mainCategory:"銀行", name:"三井住友銀行", assetClass:"現金", currency:"JPY" },
      { id:"acc_sbi_index", mainCategory:"証券口座", name:"SBI証券 インデックス", assetClass:"株式（インデックス）", currency:"JPY" },
      { id:"acc_sbi_stock", mainCategory:"証券口座", name:"SBI証券 個別株", assetClass:"株式（個別）", currency:"JPY" },
      { id:"acc_enbd", mainCategory:"外貨口座", name:"ENBD", assetClass:"外貨", currency:"AED" },
      { id:"acc_wise_usd", mainCategory:"外貨口座", name:"Wise USD", assetClass:"外貨", currency:"USD" },
      { id:"acc_cash", mainCategory:"現金", name:"現金", assetClass:"現金", currency:"JPY" },
      { id:"acc_smbc_card", mainCategory:"クレジットカード", name:"三井住友カード未払", assetClass:"クレジットカード", currency:"JPY" },
      { id:"acc_saison_card", mainCategory:"クレジットカード", name:"セゾンカード未払", assetClass:"クレジットカード", currency:"JPY" }
    ];

    const defaultData = {
      rates:{JPY:1, AED:42, USD:157},
      accounts: structuredClone(presetAccounts),
      entries:[
        {id:1, month:"2025-12", owner:"晴太", accountId:"acc_smbc", mainCategory:"銀行", assetClass:"現金", type:"asset", currency:"JPY", amount:950000, memo:""},
        {id:2, month:"2025-12", owner:"晴太", accountId:"acc_sbi_index", mainCategory:"証券口座", assetClass:"株式（インデックス）", type:"asset", currency:"JPY", amount:2200000, memo:""},
        {id:3, month:"2026-01", owner:"晴太", accountId:"acc_smbc", mainCategory:"銀行", assetClass:"現金", type:"asset", currency:"JPY", amount:1000000, memo:""},
        {id:4, month:"2026-01", owner:"晴太", accountId:"acc_sbi_index", mainCategory:"証券口座", assetClass:"株式（インデックス）", type:"asset", currency:"JPY", amount:2300000, memo:""},
        {id:5, month:"2026-02", owner:"晴太", accountId:"acc_smbc", mainCategory:"銀行", assetClass:"現金", type:"asset", currency:"JPY", amount:1050000, memo:""},
        {id:6, month:"2026-02", owner:"晴太", accountId:"acc_sbi_index", mainCategory:"証券口座", assetClass:"株式（インデックス）", type:"asset", currency:"JPY", amount:2400000, memo:""},
        {id:7, month:"2026-03", owner:"晴太", accountId:"acc_smbc", mainCategory:"銀行", assetClass:"現金", type:"asset", currency:"JPY", amount:1120000, memo:""},
        {id:8, month:"2026-03", owner:"晴太", accountId:"acc_sbi_index", mainCategory:"証券口座", assetClass:"株式（インデックス）", type:"asset", currency:"JPY", amount:2520000, memo:""},
        {id:9, month:"2026-04", owner:"晴太", accountId:"acc_smbc", mainCategory:"銀行", assetClass:"現金", type:"asset", currency:"JPY", amount:1160000, memo:""},
        {id:10, month:"2026-04", owner:"晴太", accountId:"acc_sbi_index", mainCategory:"証券口座", assetClass:"株式（インデックス）", type:"asset", currency:"JPY", amount:2650000, memo:""},
        {id:11, month:"2026-05", owner:"晴太", accountId:"acc_smbc", mainCategory:"銀行", assetClass:"現金", type:"asset", currency:"JPY", amount:1200000, memo:""},
        {id:12, month:"2026-05", owner:"晴太", accountId:"acc_sbi_index", mainCategory:"証券口座", assetClass:"株式（インデックス）", type:"asset", currency:"JPY", amount:2780000, memo:""},
        {id:13, month:"2026-06", owner:"晴太", accountId:"acc_smbc", mainCategory:"銀行", assetClass:"現金", type:"asset", currency:"JPY", amount:1250000, memo:""},
        {id:14, month:"2026-06", owner:"晴太", accountId:"acc_sbi_index", mainCategory:"証券口座", assetClass:"株式（インデックス）", type:"asset", currency:"JPY", amount:2900000, memo:""},
        {id:15, month:"2026-06", owner:"晴太", accountId:"acc_sbi_stock", mainCategory:"証券口座", assetClass:"株式（個別）", type:"asset", currency:"JPY", amount:400000, memo:""},
        {id:16, month:"2026-06", owner:"晴太", accountId:"acc_enbd", mainCategory:"外貨口座", assetClass:"外貨", type:"asset", currency:"AED", amount:35000, memo:""},
        {id:17, month:"2026-06", owner:"晴太", accountId:"acc_wise_usd", mainCategory:"外貨口座", assetClass:"外貨", type:"asset", currency:"USD", amount:8000, memo:""},
        {id:18, month:"2026-06", owner:"香花", accountId:"acc_smbc", mainCategory:"銀行", assetClass:"現金", type:"asset", currency:"JPY", amount:900000, memo:""},
        {id:19, month:"2026-06", owner:"香花", accountId:"acc_smbc_card", mainCategory:"クレジットカード", assetClass:"クレジットカード", type:"liability", currency:"JPY", amount:120000, memo:""}
      ]
    };

    let data = load();

    function load(){
      const saved = localStorage.getItem(STORAGE_KEY);
      return saved ? JSON.parse(saved) : structuredClone(defaultData);
    }

    function save(){
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      render();
    }

    function currentMonthStr(){
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
    }

    function compareMonth(a,b){
      return a.localeCompare(b);
    }

    function monthLabel(month){
      const [y,m] = month.split("-");
      return `${y}年${Number(m)}月`;
    }

    function formatJPY(value){
      return `¥${Math.round(value).toLocaleString("ja-JP")}`;
    }

    function compactJPY(value){
      const abs = Math.abs(value);
      if(abs >= 100000000) return `¥${(value/100000000).toFixed(1)}億`;
      if(abs >= 10000) return `¥${Math.round(value/10000).toLocaleString("ja-JP")}万`;
      return formatJPY(value);
    }

    function formatAmount(value,currency){
      if(currency==="JPY") return `¥${Number(value).toLocaleString("ja-JP")}`;
      if(currency==="AED") return `AED ${Number(value).toLocaleString("en-US")}`;
      if(currency==="USD") return `$${Number(value).toLocaleString("en-US")}`;
      return Number(value).toLocaleString();
    }

    function toJPY(entry){
      return Number(entry.amount) * (data.rates[entry.currency] || 1);
    }

    function accountById(id){
      return data.accounts.find(a=>a.id===id) || {name:"未登録項目", mainCategory:"その他", assetClass:"その他", currency:"JPY"};
    }

    function earliestMonth(){
      const all = data.entries.map(e=>e.month).sort();
      return all[0] || currentMonthStr();
    }

    function latestRecordedMonth(){
      const all = data.entries.map(e=>e.month).sort();
      return all.at(-1) || currentMonthStr();
    }

    function latestSelectableMonth(){
      const cur = currentMonthStr();
      return compareMonth(cur, latestRecordedMonth()) >= 0 ? cur : latestRecordedMonth();
    }

    function monthsBetween(start, end){
      let [sy, sm] = start.split("-").map(Number);
      const [ey, em] = end.split("-").map(Number);
      const arr = [];
      while(sy < ey || (sy===ey && sm <= em)){
        arr.push(`${sy}-${String(sm).padStart(2,"0")}`);
        sm++;
        if(sm===13){ sm=1; sy++; }
      }
      return arr;
    }

    function selectableMonths(){
      return monthsBetween(earliestMonth(), latestSelectableMonth());
    }

    function selectedDashboardMonth(){
      return document.getElementById("filterMonth").value || latestSelectableMonth();
    }
    function selectedDashboardOwner(){
      return document.getElementById("filterOwner").value || "all";
    }
    function selectedListMonth(){
      return document.getElementById("listMonth").value || latestSelectableMonth();
    }
    function selectedListOwner(){
      return document.getElementById("listOwner").value || "all";
    }

    function snapshotEntriesUpTo(month, owner="all"){
      const filtered = data.entries
        .filter(e => compareMonth(e.month, month) <= 0)
        .filter(e => owner==="all" || e.owner===owner)
        .sort((a,b) => compareMonth(a.month,b.month));

      const map = new Map();
      filtered.forEach(e => {
        const key = `${e.owner}__${e.accountId}`;
        map.set(key, e);
      });
      return Array.from(map.values()).sort((a,b)=>{
        if(a.mainCategory !== b.mainCategory) return a.mainCategory.localeCompare(b.mainCategory, "ja");
        return a.accountId.localeCompare(b.accountId);
      });
    }

    function totalsForSnapshot(month, owner="all"){
      const entries = snapshotEntriesUpTo(month, owner);
      const assets = entries.filter(e=>e.type==="asset").reduce((s,e)=>s + toJPY(e), 0);
      const liabilities = entries.filter(e=>e.type==="liability").reduce((s,e)=>s + toJPY(e), 0);
      return { assets, liabilities, net: assets - liabilities, entries };
    }

    function previousMonth(month){
      const months = selectableMonths();
      const idx = months.indexOf(month);
      return idx > 0 ? months[idx-1] : null;
    }

    function fillSelects(){
      const months = selectableMonths();
      const latest = latestSelectableMonth();

      const monthOptions = months.map(m => `<option value="${m}">${monthLabel(m)}</option>`).join("");

      const filterMonth = document.getElementById("filterMonth");
      const listMonth = document.getElementById("listMonth");
      const entryMonth = document.getElementById("entryMonth");

      const oldFilter = filterMonth.value || latest;
      const oldList = listMonth.value || latest;
      const oldEntry = entryMonth.value || latest;

      filterMonth.innerHTML = monthOptions;
      listMonth.innerHTML = monthOptions;
      entryMonth.innerHTML = monthOptions;

      filterMonth.value = months.includes(oldFilter) ? oldFilter : latest;
      listMonth.value = months.includes(oldList) ? oldList : latest;
      entryMonth.value = months.includes(oldEntry) ? oldEntry : latest;

      const entryMainCategory = document.getElementById("entryMainCategory");
      const entryAccount = document.getElementById("entryAccount");
      const mainCategories = [...new Set(data.accounts.map(a=>a.mainCategory))];
      const oldMain = entryMainCategory.value || mainCategories[0];
      const oldAccount = entryAccount.value;

      entryMainCategory.innerHTML = mainCategories.map(c=>`<option value="${c}">${c}</option>`).join("");
      entryMainCategory.value = mainCategories.includes(oldMain) ? oldMain : mainCategories[0];

      const accounts = data.accounts.filter(a=>a.mainCategory===entryMainCategory.value);
      entryAccount.innerHTML = accounts.map(a=>`<option value="${a.id}">${a.name}（${a.assetClass}・${a.currency}）</option>`).join("");
      if(accounts.some(a=>a.id===oldAccount)) entryAccount.value = oldAccount;
      else if(accounts[0]) entryAccount.value = accounts[0].id;

      applyAccountDefaults();
    }

    function render(){
      fillSelects();

      const month = selectedDashboardMonth();
      const owner = selectedDashboardOwner();
      const totals = totalsForSnapshot(month, owner);
      const prevMonth = previousMonth(month);
      const prevTotals = prevMonth ? totalsForSnapshot(prevMonth, owner) : { net: 0 };

      document.getElementById("summaryMonthText").textContent = `${monthLabel(month)} 時点`;
      document.getElementById("netWorth").innerHTML = `${formatJPY(totals.net).replace("¥","")}<span class="yen">円</span>`;
      const diff = totals.net - prevTotals.net;
      const diffPct = prevTotals.net ? ((diff / prevTotals.net) * 100) : 0;
      document.getElementById("deltaText").textContent = `${diff >= 0 ? "+" : ""}${formatJPY(diff)} (${diffPct >= 0 ? "+" : ""}${diffPct.toFixed(2)}%)`;

      document.getElementById("totalAssets").textContent = formatJPY(totals.assets);
      document.getElementById("totalLiabilities").textContent = formatJPY(totals.liabilities);
      document.getElementById("harutaNet").textContent = formatJPY(totalsForSnapshot(month, "晴太").net);
      document.getElementById("kyokaNet").textContent = formatJPY(totalsForSnapshot(month, "香花").net);
      document.getElementById("aedRateText").textContent = data.rates.AED;
      document.getElementById("usdRateText").textContent = data.rates.USD;

      document.getElementById("rateAED").value = data.rates.AED;
      document.getElementById("rateUSD").value = data.rates.USD;

      toggleCurrentButtons();

      renderAreaChartCard();
      renderPieCard();
      renderList();
      renderAccountList();
    }

    function toggleCurrentButtons(){
      const latest = latestSelectableMonth();
      document.getElementById("goCurrentBtn").style.display = selectedDashboardMonth() !== latest ? "inline-flex" : "none";
      document.getElementById("goCurrentBtnList").style.display = selectedListMonth() !== latest ? "inline-flex" : "none";
    }

    function goCurrentMonth(selectId){
      const latest = latestSelectableMonth();
      document.getElementById(selectId).value = latest;
      render();
    }

    function ownerLabel(owner){
      return owner === "all" ? "合計" : owner;
    }

    function chartSeriesForRange(month, owner, range){
      const months = selectableMonths().filter(m => compareMonth(m, month) <= 0);
      let use = months;

      if(range === "3m") use = months.slice(-3);
      if(range === "6m") use = months.slice(-6);
      if(range === "1y") use = months.slice(-12);
      return use.map(m => ({ month:m, value: totalsForSnapshot(m, owner).net }));
    }

    function createAreaSVG(series, width=460, height=260){
      const pad = { top:18, right:12, bottom:34, left:50 };
      const innerW = width - pad.left - pad.right;
      const innerH = height - pad.top - pad.bottom;
      const maxVal = Math.max(...series.map(s=>s.value), 1);
      const minVal = 0;
      const gridVals = Array.from({length:5}, (_,i)=> minVal + (maxVal - minVal) * (4-i) / 4);

      const points = series.map((s, i) => {
        const x = pad.left + (series.length === 1 ? innerW/2 : innerW * i / (series.length - 1));
        const y = pad.top + innerH - ((s.value - minVal) / (maxVal - minVal || 1)) * innerH;
        return { x, y, ...s };
      });

      const linePath = points.map((p,i)=>`${i===0?'M':'L'} ${p.x} ${p.y}`).join(" ");
      const areaPath = points.length
        ? `${linePath} L ${points.at(-1).x} ${pad.top + innerH} L ${points[0].x} ${pad.top + innerH} Z`
        : "";

      const xLabels = series.map((s,i)=>{
        const show = series.length <= 4 || i===0 || i===series.length-1 || i===Math.floor((series.length-1)/2);
        if(!show) return "";
        const x = pad.left + (series.length === 1 ? innerW/2 : innerW * i / (series.length - 1));
        return `<text x="${x}" y="${height-8}" text-anchor="middle" class="axis-label">${s.month}</text>`;
      }).join("");

      const yLabels = gridVals.map(v=>{
        const y = pad.top + innerH - ((v - minVal) / (maxVal - minVal || 1)) * innerH;
        return `
          <line x1="${pad.left}" y1="${y}" x2="${width-pad.right}" y2="${y}" class="axis-line" />
          <text x="${pad.left-8}" y="${y+4}" text-anchor="end" class="axis-label">${Math.round(v/10000)}</text>
        `;
      }).join("");

      const last = points.at(-1);
      const dots = last ? `<circle cx="${last.x}" cy="${last.y}" r="5.5" class="area-dot"></circle>` : "";

      return `
      <svg viewBox="0 0 ${width} ${height}" width="100%" height="100%" preserveAspectRatio="none">
        <defs>
          <linearGradient id="gradArea" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0%" stop-color="#4a79e0" stop-opacity="0.32"/>
            <stop offset="100%" stop-color="#4a79e0" stop-opacity="0.04"/>
          </linearGradient>
        </defs>
        ${yLabels}
        <line x1="${pad.left}" y1="${pad.top + innerH}" x2="${width-pad.right}" y2="${pad.top + innerH}" class="axis-bottom" />
        <path d="${areaPath}" class="area-main"></path>
        <path d="${linePath}" class="line-main"></path>
        ${dots}
        ${xLabels}
      </svg>`;
    }

    function renderAreaChartCard(){
      const month = selectedDashboardMonth();
      const owner = selectedDashboardOwner();
      const series = chartSeriesForRange(month, owner, areaRange);
      document.getElementById("areaChartCard").innerHTML = createAreaSVG(series, 460, 250);
      updateRangeTabs();
    }

    function setAreaRange(range, event){
      areaRange = range;
      updateRangeTabs();
      renderAreaChartCard();
    }

    function updateRangeTabs(){
      const labels = { "3ヶ月":"3m", "6ヶ月":"6m", "1年":"1y", "全期間":"all" };
      document.querySelectorAll(".range-tab").forEach(btn=>{
        btn.classList.toggle("active", labels[btn.textContent]===areaRange);
      });
    }

    function pieData(){
      const month = selectedDashboardMonth();
      const owner = selectedDashboardOwner();
      const entries = totalsForSnapshot(month, owner).entries.filter(e=>e.type==="asset");
      const colors = {
        "現金":"#2f63d4",
        "株式（インデックス）":"#67cfa8",
        "株式（個別）":"#59c5c4",
        "外貨":"#9dc7ff",
        "その他":"#c6d4eb"
      };
      const order = ["現金","株式（インデックス）","株式（個別）","外貨","その他"];
      const rows = order.map(k => ({
        label:k,
        color:colors[k],
        amount: entries.filter(e=>e.assetClass===k).reduce((s,e)=>s + toJPY(e), 0)
      })).filter(r=>r.amount>0);
      const total = rows.reduce((s,r)=>s+r.amount,0);
      return { rows, total };
    }

    function renderPieCard(targetId="pieCard"){
      const target = document.getElementById(targetId);
      const { rows, total } = pieData();
      if(!rows.length){
        target.innerHTML = `<div class="empty">資産データがありません</div>`;
        return;
      }
      let deg = 0;
      const gradient = rows.map(r=>{
        const start = deg;
        deg += (r.amount/total)*360;
        return `${r.color} ${start}deg ${deg}deg`;
      }).join(", ");

      const currentMonth = selectedDashboardMonth();
      const prev = previousMonth(currentMonth);
      const curTotal = total;
      const prevTotal = prev ? totalsForSnapshot(prev, selectedDashboardOwner()).assets : 0;
      const diff = curTotal - prevTotal;
      const diffPct = prevTotal ? (diff/prevTotal*100) : 0;

      target.innerHTML = `
        <div class="donut-layout">
          <div class="donut-row-meta">
            <div class="donut-meta">前月比<strong>${diff >= 0 ? "+" : ""}${formatJPY(diff)} (${diffPct >= 0 ? "+" : ""}${diffPct.toFixed(2)}%)</strong></div>
            <div class="donut-meta">基準月<strong>${monthLabel(currentMonth)}</strong></div>
          </div>
          <div class="donut-wrap">
            <div class="donut" style="background:conic-gradient(${gradient});">
              <div class="donut-center">
                <div class="label">評価額 合計</div>
                <div class="value">${formatJPY(curTotal).replace("¥","")}円</div>
              </div>
            </div>
          </div>
          <div class="legend">
            ${rows.map(r=>`<div class="legend-item"><span class="swatch" style="background:${r.color}"></span>${r.label}</div>`).join("")}
          </div>
        </div>
      `;
    }

    function renderList(){
      const month = selectedListMonth();
      const owner = selectedListOwner();
      const box = document.getElementById("entryList");

      document.getElementById("listTotalNet").textContent = formatJPY(totalsForSnapshot(month, "all").net);
      document.getElementById("listHarutaNet").textContent = formatJPY(totalsForSnapshot(month, "晴太").net);
      document.getElementById("listKyokaNet").textContent = formatJPY(totalsForSnapshot(month, "香花").net);

      const entries = totalsForSnapshot(month, owner).entries;
      if(!entries.length){
        box.innerHTML = `<div class="empty">この時点までのデータがありません。</div>`;
        return;
      }

      const groups = {};
      entries.forEach(e=>{
        if(!groups[e.mainCategory]) groups[e.mainCategory] = [];
        groups[e.mainCategory].push(e);
      });

      box.innerHTML = `<div class="card-title" style="margin-bottom:6px;">${monthLabel(month)} 時点 / ${ownerLabel(owner)}</div>
      <div class="card-sub" style="margin-bottom:10px;">指定月を含む、それ以前の最新残高を表示しています。</div>` +
      Object.keys(groups).map(group=>`
        <div style="margin-top:14px;">
          <div class="group-title">${group}</div>
          ${groups[group].map(e=>{
            const acc = accountById(e.accountId);
            return `
            <div class="row">
              <div>
                <div class="row-title">${acc.name}</div>
                <div class="row-meta">${e.owner}・${e.type==="asset"?"資産":"負債"}・${e.assetClass}<br>最終更新：${monthLabel(e.month)}${e.memo ? " / " + e.memo : ""}</div>
              </div>
              <div class="row-amt">
                ${formatAmount(e.amount, e.currency)}
                <small>${formatJPY(toJPY(e))}</small>
              </div>
            </div>`;
          }).join("")}
        </div>
      `).join("");
    }

    function renderAccountList(){
      const box = document.getElementById("accountList");
      if(!data.accounts.length){
        box.innerHTML = `<div class="empty">登録項目がありません。</div>`;
        return;
      }
      const groups = {};
      data.accounts.forEach(a=>{
        if(!groups[a.mainCategory]) groups[a.mainCategory] = [];
        groups[a.mainCategory].push(a);
      });

      box.innerHTML = `<div class="card-title" style="margin-bottom:8px;">登録済み項目</div>` +
      Object.keys(groups).map(group=>`
        <div style="margin-top:12px;">
          <div class="group-title">${group}</div>
          ${groups[group].map(a=>`
            <div class="row">
              <div>
                <div class="row-title">${a.name}</div>
                <div class="row-meta">${a.assetClass} / ${a.currency}</div>
              </div>
              <div><button class="danger" onclick="deleteAccount('${a.id}')">削除</button></div>
            </div>
          `).join("")}
        </div>
      `).join("");
    }

    function showTab(id){
      document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
      document.getElementById(id).classList.add("active");
      document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
      document.querySelector(`.tab[data-tab="${id}"]`).classList.add("active");
      if(id==="input") document.getElementById("entryMonth").value = latestSelectableMonth();
      window.scrollTo({top:0, behavior:"smooth"});
      render();
    }

    function applyAccountDefaults(){
      const acc = accountById(document.getElementById("entryAccount").value);
      document.getElementById("entryCurrency").value = acc.currency || "JPY";
      document.getElementById("entryAssetClass").value = acc.assetClass || "その他";
      if(["クレジットカード","ローン"].includes(acc.assetClass) || ["クレジットカード","ローン"].includes(acc.mainCategory)){
        document.getElementById("entryType").value = "liability";
      }else{
        document.getElementById("entryType").value = "asset";
      }
    }

    document.getElementById("entryMainCategory").addEventListener("change", ()=>{
      const main = document.getElementById("entryMainCategory").value;
      const list = data.accounts.filter(a=>a.mainCategory===main);
      document.getElementById("entryAccount").innerHTML = list.map(a=>`<option value="${a.id}">${a.name}（${a.assetClass}・${a.currency}）</option>`).join("");
      applyAccountDefaults();
    });
    document.getElementById("entryAccount").addEventListener("change", applyAccountDefaults);

    document.getElementById("entryForm").addEventListener("submit", (e)=>{
      e.preventDefault();
      const acc = accountById(document.getElementById("entryAccount").value);
      const entry = {
        id: Date.now(),
        month: document.getElementById("entryMonth").value,
        owner: document.getElementById("entryOwner").value,
        accountId: acc.id,
        mainCategory: acc.mainCategory,
        assetClass: document.getElementById("entryAssetClass").value,
        type: document.getElementById("entryType").value,
        currency: document.getElementById("entryCurrency").value,
        amount: Number(document.getElementById("entryAmount").value),
        memo: document.getElementById("entryMemo").value
      };
      const idx = data.entries.findIndex(e => e.month===entry.month && e.owner===entry.owner && e.accountId===entry.accountId);
      if(idx >= 0) data.entries[idx] = { ...data.entries[idx], ...entry, id:data.entries[idx].id };
      else data.entries.push(entry);

      document.getElementById("entryAmount").value = "";
      document.getElementById("entryMemo").value = "";

      document.getElementById("filterMonth").value = entry.month;
      document.getElementById("listMonth").value = entry.month;
      save();
      showTab("list");
    });

    document.getElementById("accountForm").addEventListener("submit", (e)=>{
      e.preventDefault();
      const name = document.getElementById("accountName").value.trim();
      if(data.accounts.some(a=>a.name===name)){
        alert("同じ小項目名がすでに登録されています。");
        return;
      }
      data.accounts.push({
        id:"acc_"+Date.now(),
        mainCategory:document.getElementById("accountMainCategory").value,
        name,
        assetClass:document.getElementById("accountAssetClass").value,
        currency:document.getElementById("accountCurrency").value
      });
      e.target.reset();
      save();
    });

    document.getElementById("rateForm").addEventListener("submit", (e)=>{
      e.preventDefault();
      data.rates.AED = Number(document.getElementById("rateAED").value);
      data.rates.USD = Number(document.getElementById("rateUSD").value);
      save();
      alert("為替レートを保存しました。");
    });

    function copyPreviousMonth(){
      const target = document.getElementById("entryMonth").value;
      const prev = previousMonth(target);
      if(!prev){
        alert("前月がありません。");
        return;
      }
      const prevEntries = data.entries.filter(e=>e.month===prev);
      if(!prevEntries.length){
        alert("前月データがありません。");
        return;
      }
      let copied = 0;
      prevEntries.forEach(e=>{
        const exists = data.entries.some(cur => cur.month===target && cur.owner===e.owner && cur.accountId===e.accountId);
        if(!exists){
          data.entries.push({ ...e, id:Date.now()+Math.random(), month:target, memo:e.memo ? `${e.memo}（前月コピー）` : "前月コピー" });
          copied++;
        }
      });
      save();
      alert(`${monthLabel(prev)} のデータを ${monthLabel(target)} に ${copied}件コピーしました。`);
    }

    function deleteAccount(id){
      if(data.entries.some(e=>e.accountId===id)){
        alert("この項目は月次データで使われているため削除できません。");
        return;
      }
      if(confirm("この項目を削除しますか？")){
        data.accounts = data.accounts.filter(a=>a.id!==id);
        save();
      }
    }

    function loadPresetAccounts(){
      presetAccounts.forEach(p=>{
        if(!data.accounts.some(a=>a.id===p.id || a.name===p.name)){
          data.accounts.push(structuredClone(p));
        }
      });
      save();
      alert("初期リストを追加しました。");
    }

    function downloadBackup(){
      const blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "ogura-family-finance-v5-backup.json";
      a.click();
      URL.revokeObjectURL(url);
    }

    function resetData(){
      if(confirm("すべてのデータをリセットしますか？")){
        localStorage.removeItem(STORAGE_KEY);
        data = load();
        render();
        showTab("dashboard");
      }
    }

    function openChartModal(type){
      const modal = document.getElementById("chartModal");
      const body = document.getElementById("modalBody");
      const title = document.getElementById("modalTitle");
      const subtitle = document.getElementById("modalSubtitle");
      const month = selectedDashboardMonth();
      const owner = selectedDashboardOwner();

      if(type==="area"){
        title.textContent = "資産推移";
        subtitle.textContent = `${monthLabel(month)} / ${ownerLabel(owner)} / 指定月以前の累積残高`;
        const series = chartSeriesForRange(month, owner, areaRange);
        body.innerHTML = `<div class="area-wrap" style="min-height:420px;">${createAreaSVG(series, 520, 400)}</div>`;
      }

      if(type==="pie"){
        title.textContent = "資産の種類別割合";
        subtitle.textContent = `${monthLabel(month)} / ${ownerLabel(owner)} / 指定月以前の累積残高`;
        body.innerHTML = `<div id="modalPie"></div>`;
        renderPieCard("modalPie");
      }

      modal.classList.add("active");
      document.body.style.overflow = "hidden";
    }

    function closeChartModal(event){
      if(event && event.target.id !== "chartModal") return;
      document.getElementById("chartModal").classList.remove("active");
      document.body.style.overflow = "";
    }

    document.addEventListener("keydown", (e)=>{
      if(e.key==="Escape") closeChartModal();
    });

    render();
  </script>
</body>
</html>
